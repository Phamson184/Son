<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="#" method="POST">
        <label>First Name : </label>
        <input type="text" placeholder="Enter First Name"><br><br>
        
        <label>Last Name : </label>
        <input type="text" placeholder="Enter Last Name"><br><br>
        
        <label>Email : </label>
        <input type="email" placeholder="Enter Email Address"><br><br>
        
        <label>Password : </label>
        <input type="password"><br><br>
        
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male <br>
        <input type="radio" name="gender" value="Female"> Female <br>
        <input type="radio" name="gender" value="Other"> Other <br><br>
        
        <label>Age : </label>
        <input type="number"><br><br>
        
        <label>Preferences :</label><br>
        <input type="checkbox" name="pref" value="Acrylic"> Acrylic Painting <br>
        <input type="checkbox" name="pref" value="Oil"> Oil Painting <br>
        <input type="checkbox" name="pref" value="Watercolor"> Water Color Painting <br><br>
        
        <label>Select Occupation </label>
        <select>
            <option>Student</option>
        </select><br><br>
        
        <label>Bio</label><br>
        <textarea rows="4" cols="30" placeholder="Share few lines about yourself..."></textarea><br><br>
        
        <input type="reset" value="RESET">
        <input type="submit" value="SUBMIT">
    </form>
</body>
</html>
