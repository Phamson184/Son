<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nested Table</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 18px; }
        
        /* Bảng chính: Dùng separate để viền tách rời, tạo cảm giác nổi */
        .main-table { 
            width: 700px; 
            margin: 20px auto; 
            text-align: left; 
            border-collapse: separate; 
            border-spacing: 3px; /* Khoảng hở giữa các ô */
            border: 2px solid #000; 
        }
        .main-table th, .main-table td { 
            border: 1px solid #000; 
            padding: 10px; 
        }
        
        .header-cyan { 
            background-color: #48D1CC; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
        }
        
        /* Bảng lồng bên trong */
        .nested-table { 
            width: 100%; 
            text-align: left; 
            border-collapse: separate; 
            border-spacing: 3px; 
            border: 2px solid #000; 
            margin: 5px 0;
        }
        .nested-table th, .nested-table td { 
            border: 1px solid #000; 
            padding: 8px; 
        }
        
        .header-yellow { 
            background-color: #F0E68C; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<table class="main-table">
    <tr class="header-cyan">
        <th>Device</th>
        <th>Brand</th>
        <th>Specifications</th>
    </tr>
    <tr>
        <td>Smartphone</td>
        <td>Apple</td>
        <td>
            <!-- BẢNG LỒNG (NESTED TABLE) -->
            <table class="nested-table">
                <tr class="header-yellow">
                    <th>Model</th>
                    <th>Storage</th>
                </tr>
                <tr>
                    <td>iPhone 12 Pro</td>
                    <td>256GB</td>
                </tr>
                <tr>
                    <td>iPhone SE</td>
                    <td>128GB</td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td>Laptop</td>
        <td>HP</td>
        <td>15.6" Display</td>
    </tr>
    <tr>
        <td>Tablet</td>
        <td>Samsung</td>
        <td>10.5" Display</td>
    </tr>
</table>

</body>
</html>
